name: Publish a Field Guide resource
description: Add a resource to the FISCH website using a mobile-friendly form.
title: "Resource: "
body:
  - type: markdown
    attributes:
      value: "For the FISCH owner. Publishing is restricted to the repository owner. Use an existing public FISCH URL. Do not paste confidential information."
  - type: input
    id: title
    attributes:
      label: Resource title
      placeholder: "The Repeatability Checklist"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Format
      options:
        - Printable field guide
        - Worksheet
        - Interactive tool
        - Field note
        - Video
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "One sentence explaining what the visitor will gain."
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Public link
      placeholder: "/resources/example/"
      description: "A working FISCH page path or HTTPS link. Create the page first."
    validations:
      required: true
