name: Publish FISCH resource from mobile
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
concurrency:
  group: fisch-resource-publishing
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.issue.user.login == 'pfischy' && startsWith(github.event.issue.title, 'Resource: ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
        with:
          persist-credentials: true
      - name: Publish verified resource
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 .github/scripts/publish_resource.py
      - name: Commit content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/resources.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish FISCH resource from issue #${{ github.event.issue.number }}"
            git push
          fi
